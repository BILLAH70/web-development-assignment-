<!doctype html>
<html>
  <head>
    <title>Student Information Table</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }

      h2 {
        color: darkblue;
      }

      table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid black;
        padding: 10px;
      }

      th {
        background-color: lightblue;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h2>Student Information Table</h2>

    <table>
      <tr>
        <th>SL No</th>
        <th>Name</th>
        <th>Roll</th>
        <th>Member</th>
        <th>Section</th>
      </tr>

      <tr>
        <td>1</td>
        <td>Student 1</td>
        <td>101</td>
        <td>Leader</td>
        <td>A</td>
      </tr>

      <tr>
        <td>2</td>
        <td>Student 2</td>
        <td>102</td>
        <td>Member</td>
        <td>A</td>
      </tr>

      <tr>
        <td>3</td>
        <td>Student 3</td>
        <td>103</td>
        <td>Member</td>
        <td>A</td>
      </tr>
    </table>
  </body>
</html>
